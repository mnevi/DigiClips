<div class="compose-container">
  <header class="compose-header">
    <div class="header-left">
      <h1>🔔 Create Email Alerts</h1>
    </div>
  </header>

  <form class="compose-form">
    <div class="compose-fields">
      
      <div class="field">
        <p class="ai-hint">An email will be sent to you whenever additional search results are found.</p>
      </div>

      <div class="field">
        <label for="alert">Search Term</label>
        <input 
          id="alert"
          type="text"
          placeholder="Enter your alert message"
          class="field-input"
        />
      </div>

      <div class="field">
        <label for="frequency">Search Frequency</label>
        <select id="frequency" class="field-input">
          <option value="1m">1 minute</option>
          <option value="5m">5 minutes</option>
          <option value="1h">1 hour</option>
          <option value="1d">Daily</option>
        </select>
      </div>

    </div>

    <div class="compose-footer">
      <div class="footer-left">
        <button type="submit" class="btn-primary">
          Create Alert
        </button>
      </div>
    </div>
  </form>
</div>
