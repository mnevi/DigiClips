<div class="compose-container">
  <header class="compose-header">
    <div class="header-left">
      <h1>🔍 Keyword Search</h1>
    </div>
  </header>

  <div class="compose-form">
    <div class="compose-fields">
      
      <div class="field">
        <label>Search</label>
        <input 
          type="text" 
          [(ngModel)]="searchTerm" 
          placeholder="Type to search..."
          class="field-input"
        />
      </div>

      <div class="field">
        <button class="btn-secondary" (click)="addAlert()">
          + Create Alert
        </button>
      </div>

      <div class="attachments-section">
        <label class="attachment-label">Results</label>
        
        <div class="attachments-list">
          @for (result of results(); track result.title) {
            <div class="attachment-item">
              <span class="attachment-icon">📄</span>
              <div class="attachment-info">
                <div class="attachment-name">{{ result.title }}</div>
                <div class="attachment-description">{{ result.description }}</div>
              </div>
            </div>
          }
        </div>
      </div>
      
    </div>
  </div>
</div>
